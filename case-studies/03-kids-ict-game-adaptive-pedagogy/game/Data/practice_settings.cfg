; Settings for Unit 2's replayable practice modes (Scripts/unit_2_word_practice.gd
; and Scripts/unit_2_practice.gd). Edit the values below to change how long a
; round of each one is.
;
; A copy of this file placed next to the exported game's .exe overrides this
; bundled copy immediately, no rebuild needed — same rule as
; Data/word_practice_words.tsv.

[word_train]
; How many words make up one round of "Word Train". Must be at least 1.
words_per_round=10

[speed_round]
; How many seconds one round of "Zig's Speed Round" lasts. Must be at least 10.
round_seconds=60
