<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Welcome to Daybook</title>
    <style>
      /* Desktop app loading screen, shown by electron/main.ts in a 720 x 450 frameless window while the app opens */
      /* Inter, the app's typeface; a copy lives here because the app's bundled font files have build-time names */
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
      }
      :root {
        color-scheme: light;
        --paper: #f7f6f2;
        --ink: #282624;
        --muted: #8b8580;
        --accent: #7c3029;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      body {
        color: var(--ink);
        background:
          radial-gradient(ellipse at 30% 45%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.72) 28%, transparent 62%),
          linear-gradient(145deg, #fbfaf7 0%, var(--paper) 54%, #efede7 100%);
        font-family: 'Inter Variable', Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .screen {
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: 300px 1fr;
        align-items: center;
        height: 100%;
        padding: 0 48px 0 36px;
        border: 1px solid rgba(65, 47, 42, 0.12);
      }
      /* the soft halo behind the logo */
      .screen::before,
      .screen::after {
        position: absolute;
        z-index: -1;
        content: '';
        pointer-events: none;
        border-radius: 50%;
        left: 186px;
        top: 50%;
        translate: -50% -50%;
      }
      .screen::before {
        width: 380px;
        aspect-ratio: 1;
        border: 1px solid rgba(124, 48, 41, 0.055);
        box-shadow:
          0 0 0 30px rgba(124, 48, 41, 0.018),
          0 0 0 66px rgba(124, 48, 41, 0.012);
        animation: halo-in 1.8s ease-out both;
      }
      .screen::after {
        width: 260px;
        aspect-ratio: 1;
        background: rgba(255, 255, 255, 0.58);
        filter: blur(45px);
        animation: breathe 7s ease-in-out 1.5s infinite;
      }
      .logo-frame {
        width: 240px;
        height: 316px;
        justify-self: center;
        filter: drop-shadow(0 16px 26px rgba(54, 26, 22, 0.07));
        animation: content-in 1.1s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }
      .logo-frame svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      /* The logo's own animation loops every 6.8s; here it plays once, a little faster, and stays where it ends */
      .logo-frame svg * {
        animation-duration: 4800ms !important;
        animation-iteration-count: 1 !important;
        animation-fill-mode: forwards !important;
      }
      /* ...without its closing fade, so the finished logo stays until the app is ready */
      .logo-frame svg #art {
        animation: none !important;
        opacity: 1;
      }
      .text {
        padding-left: 28px;
        border-left: 1px solid rgba(65, 47, 42, 0.1);
      }
      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: 0.035em;
        font-weight: 500;
        animation: text-in 0.9s ease-out 0.35s both;
      }
      .rule {
        width: 38px;
        height: 1px;
        margin: 16px 0 14px;
        background: var(--accent);
        opacity: 0.55;
        transform-origin: left;
        animation: rule-in 0.8s ease-out 0.55s both;
      }
      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        animation: text-in 0.9s ease-out 0.55s both;
      }
      .loading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 52px;
        color: #99918b;
        font-size: 11px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        animation: text-in 0.8s ease-out 0.8s both;
      }
      .track {
        width: 76px;
        height: 2px;
        overflow: hidden;
        border-radius: 10px;
        background: rgba(124, 48, 41, 0.12);
      }
      .track::after {
        display: block;
        width: 38%;
        height: 100%;
        content: '';
        border-radius: inherit;
        background: var(--accent);
        animation: progress 2.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
      }
      .corner-note {
        position: absolute;
        right: 22px;
        bottom: 18px;
        color: #a39c96;
        font-size: 10px;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }
      /* the desktop app adds this just before it shows the main window */
      body.leaving {
        opacity: 0;
        transition: opacity 280ms ease-out;
      }
      @keyframes content-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes text-in {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes rule-in {
        from {
          transform: scaleX(0);
          opacity: 0;
        }
        to {
          transform: scaleX(1);
          opacity: 0.55;
        }
      }
      @keyframes halo-in {
        from {
          opacity: 0;
          scale: 0.94;
        }
        to {
          opacity: 1;
          scale: 1;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          scale: 0.96;
          opacity: 0.48;
        }
        50% {
          scale: 1.05;
          opacity: 0.8;
        }
      }
      @keyframes progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(290%);
        }
      }
      /* People who switch animations off see everything finished straight away */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
        .logo-frame svg * {
          animation: none !important;
        }
        .logo-frame svg path {
          stroke-dashoffset: 0 !important;
        }
        .logo-frame svg #type path {
          fill-opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Welcome splash screen">
      <div class="logo-frame" id="logo" role="img" aria-label="Daybook animated logo"></div>
      <section class="text" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Welcome to Daybook</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="eyebrow">A thoughtful beginning</p>
        <div class="loading" role="status" aria-live="polite">
          <span>Preparing your experience</span>
          <span class="track" aria-hidden="true"></span>
        </div>
      </section>
      <div class="corner-note" id="corner">Daybook</div>
    </main>
    <script>
      // The logo is inlined (not an <img>) so the styles above can set how its animation plays
      fetch('assets/daybook-logo-animated.svg')
        .then((r) => r.text())
        .then((svg) => {
          document.getElementById('logo').innerHTML = svg
        })
        .catch(() => {})
      // The desktop app passes its version, shown in the corner like other desktop splash screens
      const version = new URLSearchParams(location.search).get('v')
      if (version) document.getElementById('corner').textContent = `Daybook · v${version}`
    </script>
  </body>
</html>
